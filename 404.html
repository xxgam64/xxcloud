<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : null;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(newFetch) {
              currentFetch = typeof newFetch === 'function' ? newFetch : originalFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          try {
            let protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get() {
                return protoFetch;
              },
              set(newFetch) {
                protoFetch = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (err) {}
        }
      })();
    </script>
    <title>XXCLOUD - Multi Google Drive Hub</title>
    <meta name="description" content="XXCLOUD: Dasbor terpadu multi-akun Google Drive dengan enkripsi end-to-end, sinkronisasi real-time, pencarian lintas drive, dan analitik penyimpanan." />

      }
    </script>
